name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    # App 是 WPF（net8.0-windows），測試也用到 Windows ACL，必須在 Windows 上跑。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 9.0 SDK 與本機開發環境相同；8.0 runtime 用來執行 net8.0 的測試。
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Build
        run: dotnet build ShootSorter.sln -c Release

      - name: Test
        run: dotnet test ShootSorter.sln -c Release --no-build --logger "console;verbosity=normal"
